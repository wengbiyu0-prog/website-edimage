<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDIMAGE WORLD · 更多灵感</title>
  <style>
    :root {
      --bg: #070101;
      --panel: rgba(20, 12, 5, 0.76);
      --panel-strong: rgba(12, 7, 3, 0.9);
      --line: rgba(255, 194, 61, 0.23);
      --text: rgba(255, 236, 183, 0.9);
      --text-soft: rgba(255, 236, 183, 0.62);
      --accent: #ffc43d;
      --mono: "Courier New", "IBM Plex Mono", monospace;
      --serif: "Songti SC", "Noto Serif SC", "SimSun", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: var(--serif);
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 181, 43, 0.18), transparent 28rem),
        radial-gradient(circle at 86% 86%, rgba(178, 48, 30, 0.18), transparent 20rem),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(180deg, #0b0303 0%, #020101 100%);
      background-size: auto, auto, 12px 12px, auto;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 6px);
      mix-blend-mode: screen;
      opacity: 0.36;
    }

    .page {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(36px, 7vw, 84px) 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: clamp(36px, 6vw, 68px);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-shadow: 0 0 14px rgba(255, 196, 61, 0.45);
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 0 26px rgba(255, 196, 61, 0.28);
    }

    .lede {
      max-width: 720px;
      margin: 22px 0 0;
      color: var(--text-soft);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.9;
    }

    .status {
      margin-top: 28px;
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .memory-list {
      display: grid;
      gap: 18px;
      margin-top: clamp(32px, 5vw, 56px);
    }

    .memory-card {
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 20px 80px rgba(0,0,0,0.26);
      backdrop-filter: blur(10px);
    }

    .memory-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .memory-title {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 500;
    }

    .memory-text {
      margin: 0;
      white-space: pre-wrap;
      color: var(--text);
      font-size: clamp(1rem, 1.8vw, 1.12rem);
      line-height: 2;
    }

    .empty {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text-soft);
      background: var(--panel-strong);
    }

    ::selection {
      color: #120802;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar">
      <span>EDIMAGE WORLD / WORLD MEMORY</span>
      <a href="index.html">回到入口</a>
    </nav>

    <header>
      <h1>更多灵感</h1>
      <p class="lede">这里陈列所有进入记忆共同体的文本碎片。它们不是评论区，而是 EDIMAGE WORLD 的共享脑海：后续生成会优先召回这些意象、语气、地点和未完成的句子。</p>
      <p class="status" id="status">loading memory...</p>
    </header>

    <section class="memory-list" id="memoryList"></section>
  </main>

  <script>
    const statusEl = document.querySelector("#status");
    const memoryList = document.querySelector("#memoryList");

    hydrateMemory();

    async function hydrateMemory() {
      try {
        const response = await fetch(apiPath("/api/knowledge"));
        const result = await response.json();
        const entries = response.ok && result.ok && Array.isArray(result.entries) ? result.entries : [];
        renderMemory(entries);
      } catch (error) {
        statusEl.textContent = "memory unavailable";
        memoryList.innerHTML = `<div class="empty">暂时无法读取云端记忆。请从本地服务或线上站点打开本页。</div>`;
      }
    }

    function apiPath(path) {
      if (window.location.protocol === "file:") {
        return `http://localhost:3000${path}`;
      }
      return path;
    }

    function renderMemory(entries) {
      if (!entries.length) {
        statusEl.textContent = "0 fragments";
        memoryList.innerHTML = `<div class="empty">记忆共同体暂时还没有条目。</div>`;
        return;
      }

      const ordered = entries.slice().reverse();
      statusEl.textContent = `${ordered.length} fragments`;
      memoryList.innerHTML = ordered.map((entry, index) => `
        <article class="memory-card">
          <div class="memory-meta">
            <span>#${String(ordered.length - index).padStart(3, "0")}</span>
            <span>${escapeHtml(entry.author || "匿名缔造者")}</span>
            <span>${escapeHtml(entry.tags || "未标记")}</span>
            <span>${formatDate(entry.createdAt || entry.created_at)}</span>
          </div>
          <h2 class="memory-title">${escapeHtml(entry.title || "未命名碎片")}</h2>
          <p class="memory-text">${escapeHtml(entry.text || "")}</p>
        </article>
      `).join("");
    }

    function formatDate(value) {
      if (!value) return "unknown time";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "unknown time";
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}.${String(date.getDate()).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
